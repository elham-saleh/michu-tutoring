    <section>
      <h2>Request an Online Tutor</h2>
      <form action="mailto:lalumi1o6e@gmail.com" method="post" enctype="text/plain">
        <p>
          <label for="full-name">Full Name (Required):</label><br>
          <input type="text" id="full-name" name="full_name" required>
        </p>
        <p>
          <label for="student-email">Email Address (Required):</label><br>
          <input type="email" id="student-email" name="email" required>
        </p>
        <p>
          <label for="role">I am registering as:</label><br>
          <select id="role" name="role">
            <option value="student_parent">Student or Parent</option>
            <option value="tutor">Online Tutor</option>
          </select>
        </p>
        <p>
          <label for="notes">Subject and Preferred Schedule:</label><br>
          <textarea id="notes" name="notes" rows="4" cols="40"></textarea>
        </p>
        <p>
          <button type="submit">Submit Request</button>
        </p>
      </form>
